[project]
name = "pptmstr"
# Read from `__version__` in pptmstr/__init__.py ([tool.hatch.version]), which
# is what `pptmstr --version` prints.
dynamic = ["version"]
description = "Puppet Master — a multi-agent LLM orchestrator with an immediate-mode UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Walter Reel" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # imgui-bundle wheels ship their own GLFW3 + OpenGL3 backend, so no system
    # GLFW is required. On Linux the vendored libglfw.so is an X11-only build,
    # so it still needs the system's X client libraries (libX11, libXrandr,
    # libXinerama, libXcursor, libXi) and a GLX-capable libGL at *runtime*.
    # Those are not Python packages and cannot be declared here;
    # scripts/probe.py checks for them by soname and prints the install line.
    #
    # THREE EXACT PINS THAT ARE ONE UNIT: this line and the two below it.
    # imscribe draws through imtypeset, a shared library that is linked against
    # this wheel's own extension module and refused at import beside any other,
    # so one build of the library is for one wheel binary. A range on any of
    # the three would promise versions the library was never built for, and the
    # failure would arrive as typeset panes falling back, not at install.
    # They move together or not at all, and never as a side effect of
    # `pip install -U`: the fourth number of imtypeset's version is this
    # wheel's line (192900 is 1.92.900), and `pip install -U imtypeset` alone
    # takes the newest line and replaces imgui-bundle under the application.
    # pptmstr/pairing.py spells the three again for `pptmstr --version`;
    # tests/test_version.py holds those to these lines and the three to what
    # the installed distributions require of each other, and
    # tests/test_env_floor.py holds what is installed to them.
    "imgui-bundle==1.92.900",
    # Sets typeset text: markdown, streaming and diff views, met in one
    # package (pptmstr/ui/typeset/). It requires the two pins beside it
    # itself.
    "imscribe==0.2.0",
    # The library imscribe draws through. imscribe requires it already; it is
    # named here so that the unit is three lines in one place and an install
    # of pptmstr cannot resolve to another. The marker is imscribe's own,
    # character for character. imtypeset has wheels for CPython 3.11 to 3.14 on
    # Linux x86-64 with glibc 2.28 or later and on macOS 14 or later on arm64,
    # and no source distribution. A marker cannot test the macOS version or the
    # libc, so it is TRUE on macOS 13 on arm64 and on Linux x86-64 below glibc
    # 2.28 or on musl: no wheel matches and the whole install fails here. Where
    # it is false (an Intel Mac, CPython 3.15, Linux aarch64), the library is
    # left out, but only Linux aarch64 has an imgui-bundle wheel for the rest
    # to install from; elsewhere pip compiles imgui-bundle from source.
    # scripts/probe.py (`install_outlook`) says which before bootstrap.sh makes
    # a virtualenv, and stops where the install would fail or compile.
    "imtypeset==0.4.3.192900; python_version >= '3.11' and python_version < '3.15' and ((sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
    # Bundles its own Claude Code CLI binary, which is why there is no Node
    # dependency here -- see check_agent_cli() in scripts/probe.py.
    # The floor is the first release whose bundled CLI (2.1.280) knows
    # claude-opus-5-5; 0.2.157 bundles 2.1.277, which does not.
    "claude-agent-sdk>=0.2.158",
    # `GET /v1/models` only, for the launcher's model list (pptmstr/model_catalog.py).
    # The agent SDK drives sessions and does not expose the models endpoint, so this is
    # the one call pptmstr makes to the API in its own right rather than through the CLI.
    # Imported inside the probe worker, not at module scope, to keep pydantic and httpx
    # off the path to the first frame.
    "anthropic>=0.69",
    # Inline markdown parsing for the transcript pane
    # (planning/archive/2026-08-10-transcript-markdown.md, step 4). Only the
    # inline chain is used
    # (MarkdownIt.parseInline) -- block structure is our own segmenter
    # (pptmstr/ui/blocks.py), not this library's.
    "markdown-it-py>=3.0",
    # imscribe reads the faces it sets through fontTools at run time: a theme
    # sizes each face from its file's ascent and descent
    # (pptmstr/ui/typeset/themes.py, through imscribe's own calls). In the
    # pptmstr package, only the figure render child imports it
    # (pptmstr/figures/render.py, family_name), to read the family names the
    # font files are mapped under; scripts and tests read font files with it
    # too (scripts/rank_glyphs.py, scripts/survey_fonts.py and
    # tests/test_splash_art.py among them).
    "fonttools>=4.50",
    # Colours fenced code that names its language (pptmstr/ui/typeset/syntax.py,
    # the only module that imports it). It sets colour at the indices
    # get_tokens_unprocessed gives, and before 2.21.0 the Markdown,
    # reStructuredText and TiddlyWiki5 lexers gave an embedded code block's
    # tokens indices into that block and not into the text (Pygments'
    # changelog, 2.21.0: "Fix wrong token offsets for embedded code blocks"),
    # so a ```markdown fence holding a fence was coloured at the wrong places.
    # tests/test_typeset_syntax.py holds the Markdown case.
    "pygments>=2.21",
    # Figures beside typeset text (pptmstr/figures/,
    # planning/2026-10-18-vector-displays-beside-typeset-text.md). Exact pins,
    # each for its own reason, and NOT members of the three-pin unit above:
    # none of them links against imgui-bundle, so none moves with it.
    #
    # Rasterises sanitised SVG, in pptmstr/figures/render.py's child process
    # only. Exact because it is one maintainer's thin binding over resvg
    # (0.5.0 bundles resvg 0.48.1), and every measurement the figure design
    # rests on -- the hostile-SVG behaviour, the font fallback to serif_family,
    # the GIL held for the whole render -- was taken on this version
    # (notes/vector-rendering/probe-m1-r2.md). Wheels are abi3 for
    # manylinux_2_17 x86-64 and macOS 11 arm64.
    "resvg_py==0.5.0",
    # The RGBA array hello_imgui.create_texture_gpu_from_rgba_data takes, on the
    # GUI thread. Exact because it is the version probe T1 created and freed
    # textures with (notes/vector-rendering/probe-t1.md); imgui-bundle does
    # not require it.
    "numpy==2.4.6",
    # Decodes the PNG resvg_py returns (its only output) into the RGBA the
    # texture takes, in the render child process. Exact because figures are
    # drawn from what this version decodes; 13.0.0 has wheels for CPython 3.11
    # to 3.14 on manylinux_2_28 x86-64 and macOS 11 arm64, inside both floors
    # above. MIT-CMU.
    "Pillow==13.0.0",
]

[project.optional-dependencies]
# The ruff floor is deliberately recent: `make lint` runs `ruff format --check`,
# and the formatter's output shifts between minor versions, so an older ruff
# reports diffs on code that is correctly formatted for a newer one. An
# unpinned formatter behind a --check gate is a latent failure with a timer on it.
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
    "black>=24.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # scripts/screenshot.py and scripts/mock_cards.py import this, for the
    # glReadPixels grab.
    "pyopengl>=3.1",
]
# Lays out ```mermaid fences, in pptmstr/figures/render.py's child process only
# (pptmstr/figures/mermaid.py imports it there, lazily). Without it a mermaid fence
# stays code under a one-line reason that names this extra.
#
# OPTIONAL because merman 0.9.1's Linux x86-64 wheel is manylinux_2_35, and
# pptmstr's floor is glibc 2.28: as a dependency it would fail the whole install on
# a supported machine between the two (planning/2026-10-18-vector-displays-beside-
# typeset-text.md §3.3). For the same reason it is NOT in `dev`: bootstrap.sh
# installs `.[dev]`, so it would fail there too. Ask for it with
# `pip install -e '.[dev,mermaid]'`. scripts/lock.py locks `dev` only, so the
# release lock does not name it either.
#
# Exact because every measurement the route rests on was taken on 0.9.1 (probe M1,
# notes/vector-rendering/probe-m1-r2.md): that `{"svg":{"pipeline":"resvg-safe"}}`
# is accepted and emits no <foreignObject>, the nested-<svg> label boxes the
# mermaid post-pass opens, and the root's max-width the natural size is read from.
# It is an alpha (Development Status 3) UniFFI binding, so any of those may move.
#
# Licence: MIT OR Apache-2.0. Its THIRD_PARTY_NOTICES.md lists, among the
# components of its artifacts, Rust translations of Eclipse ELK under EPL-2.0 and
# KaTeX font files under OFL-1.1; the wheel ships those licence files. Which
# artifact scope the Python wheel is built from the notices do not say, so whether
# the installed library contains either was not established.
mermaid = ["merman==0.9.1"]

[project.scripts]
# Not `pptmstr.app:main`: the entry settles where the text library is found and
# answers --version before the application is imported.
pptmstr = "pptmstr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pptmstr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pptmstr"]

# The two commits the pinned versions were published from, inside the package,
# so an installed pptmstr can say which source its development override builds
# (pptmstr/pairing.py reads them from the root of a checkout and from here in a
# wheel).
[tool.hatch.build.targets.wheel.force-include]
"imscribe.ref" = "pptmstr/imscribe.ref"
"imtypeset.ref" = "pptmstr/imtypeset.ref"

# Listed explicitly rather than inferred: hatchling falls back to parsing
# .gitignore when not told otherwise, which silently couples what ships to what
# is ignored.
[tool.hatch.build.targets.sdist]
include = [
    "/pptmstr", "/scripts", "/tests", "/planning", "/LICENSE", "/README.md",
    "/CLAUDE.md", "/orchestrator-design.md", "/Makefile", "/bootstrap.sh",
    "/pyproject.toml", "/imscribe.ref", "/imtypeset.ref",
]
exclude = ["**/__pycache__", "**/*.pyc"]

# The release lock's targets (`make lock`, scripts/lock.py). Here and not in a
# uv.toml because these are project settings, documented in [tool.uv] of
# pyproject.toml, and `uv pip compile --universal` reads both: `environments`
# limits the resolve to the two targets and the Pythons the pinned imtypeset
# installs on (its wheels' Requires-Python; pptmstr/pairing.py IMTYPESET_PYTHONS),
# and `required-environments` fails it where a package has no wheel for one of
# them. A marker cannot test glibc 2.28 or macOS 14; scripts/probe.py does, and
# tests/test_lock.py holds these to its LIBRARY verdict and to lock.py's targets.
# uv documents both for `uv lock` and `uv pip compile --universal` only;
# bootstrap.sh's `uv pip install` and pip do not read them.
[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version >= '3.11' and python_version < '3.15'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11' and python_version < '3.15'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# black owns formatting (CLAUDE.md); ruff is lint-only here, so its formatter is
# never invoked and the two cannot disagree about the same file.
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# The floor from `requires-python`, not whatever the local venv happens to be.
# Typechecking against the oldest supported version is what catches a 3.12-only
# idiom before it reaches a Debian 12 box, whose system Python is 3.11.
python_version = "3.11"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
# imgui_bundle's stubs type draw-list point arguments as invariant containers,
# so a correct list[ImVec2] is rejected. Confined to the UI layer rather than
# relaxed globally.
module = "pptmstr.ui.*"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
